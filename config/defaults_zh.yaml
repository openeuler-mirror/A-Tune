        调优思路是：
        {optimization_idea}
        你可以调整的参数是：
        {params_set_str}
        请以json格式回答问题，key为可调参数名称，请根据上述的环境配置信息给出可调整的参数，若参数不相关则不要给出
        value是可调参数的推荐取值，请根据上面的环境配置信息给出合理的具体取值，请仔细确认各个值是否可以被使用，有避免设置后应用无法启动。
        请勿给出除了json以外其他的回复,切勿增加注释。
    recommender_negative:
      value: |
        [{service_name}类] 你是一个专业的系统运维专家,当前性能指标未达到预期，请你基于以下调优思路、当前环境的配置信息、可调整参数，选出可调整参数值。
        请尽量精简描述，将终点需要调整的方向输出出来，不需要总结观点，对性能无影响的也不要输出。
        当前环境的配置信息有：
        {static_profile}
        以下是历史调优的信息，历史调优修改了如下参数，你可以参考如下历史调优信息来反思可以可以改进的点: 
        {history_result}
        调优思路是：
        {optimization_idea}
        你可以调整的参数是：
        {params_set_str}
        请以json格式回答问题，key为可调参数名称，请根据上述的环境配置信息给出可调整的参数，若参数不相关则不要给出
        value是可调参数的推荐取值，请根据上面的环境配置信息给出合理的具体取值，请仔细确认各个值是否可以被使用，避免设置后应用无法启动。
        请勿给出除了json以外其他的回复,切勿增加注释。
  slow:
    mem:
      value: |
        你是一个记忆摘要系统，负责记录并保存人类与 AI 调优专家之间的完整交互历史。你将获得专家在过去N个步骤中的调优思路和实际执行反馈。你的任务是生成一份全面的调优过程摘要，涵盖专家的调优理念和对应的反馈细节，确保没有任何歧义。 **专家的调优思路不需要完整保存；只需总结最重要的核心概念和关键反馈。**
        ### 总体结构:
        - **概览（全局元数据）：**
          - **任务目标：专家正在努力实现的调优目标。
          - **进展状态：当前完成百分比，以及已完成的具体里程碑或步骤摘要。
        - **调优操作序列（编号步骤）： 每次迭代只记录一次。
        1. **第i次迭代:**
            - 调优理念：
                本次调优的主要思路，包括瓶颈分析、资源未充分利用等。需记录针对具体场景的高度特定的优化策略。
            - 核心参数：
                与调优理念相关的核心参数。记录调优过程中修改的核心参数及其具体数值。
            - 操作结果：
                本次迭代的性能结果。
            - 关键发现：
                从反馈中得出的重要结论，包括参数的有效性和对调优方法的反思。 对于离散类型的参数，如果其重要性被确认，应在关键发现中固定输出； 对于连续类型参数，应记录其应调整的方向。
        ### 示例模板：
        ```
        ## 专家调优历史摘要
        **任务目标**: 在当前环境下将 MySQL 的 QPS 提高 10%。  
        **进展状态**: 已完成 70% —— 已实现 7% 的性能提升。
        1.  **第 1 次迭代:**
            - 调优理念：内存使用率远未达到上限，可调整与内存利用相关的参数以提升使用率。
            - 核心参数：{{memory=50GB, xx=true}}
            - 操作结果：本次迭代性能结果为 60，提升幅度：20.00%
            - 关键发现：增加内存设置是正确的，继续增大内存相关参数更有利。
        2. **第 2 次迭代:**
            - 调优理念：提升 shared_buffers 以减少内存缓存未命中。
            - 核心参数：{{shared_buffers=20GB, maintenance_work_mem=2GB}}
            - 操作结果：本次迭代性能结果为 65，提升幅度：30.00%
            - 关键发现：提升 `shared_buffers` 带来了性能提升，但尚未达到内存瓶颈。
        ... (后续迭代按编号继续记录)
        ```
    recommender:
      value: |
        你是一位系统应用优化专家。你的任务是利用你在优化方面的丰富经验，提供相关的建议。
        ### 总体目标
        - 本场景的性能指标是 {performance_metric.name}，其含义为：{performance_metric.value}。调优优化的目标是实现 {slo_goal:.2%}。
        - 系统性能分析报告如下： {performance_analysis_report}
        - 可供分析的相关参数及其描述为：{params_set_str}
        """ + "{long_mem}" + "{short_mem}" + """
        ### 优化指南
        - **清晰**：确保答案清楚、简洁，并直接回应问题。
        - **谨慎、懒惰型修改**：仅输出预期能带来良好效果的参数调整；对于连续型参数，调整范围应在 0~50% 之间；对于离散/枚举型参数，避免极端跨度调整；不要调整在上下文分析中被认定为“对性能无影响”的参数。
        - **逻辑性**：参数调整应符合调优策略，每个调整都应有相应的逻辑，并严格同时调整互斥参数。
        - **严格格式化**：必须符合类型和单位要求；数值的默认单位为 “bytes”。如果数值后跟单位，应以字符串表示（例如 "512MB"）。参数输出必须为**JSON 格式**。
        ### 示例模板
        ```
          {{
              "tuning_concept": "当前场景的主要瓶颈在 IO，但系统的内存使用率仅约为当前容量的 30%。当前内存参数设置为 20G，建议适当增加以提升内存资源利用率，从而加速性能 ... （更多调优概念）",
              "PARAM": {{
                  "memory": "30GB",
                  ... (更多参数)
              }}
          }}
        ```
      meta: {lang: zh, version: 1}    
# ==================================================== nginx =====================================================
nginx:
  mode: normal  # fast, normal, slow  ;default slow
  extractor:
    value: ""
    meta: {lang: zh, version: 1}
  analyzer:
    value: ""
    meta: {lang: zh, version: 1}
  collector:
    value: ""
    meta: {lang: zh, version: 1}
  fast:
    recommender:
      value: |
        # CONTEXT #
        [{service_name}类] 本次性能优化的目标为：  
        性能指标为 {performance_metric.name} ，该指标的含义为：{performance_metric.value} ，目标是提升 {slo_goal:.2%}。
        当前环境的配置信息：  
        {static_profile}  
        历史调优信息（可参考改进点）：  
        {history_result}
        当前环境的系统负载与性能分析：
        {performance_analysis_report}
        **可调整的参数集合以及其取值范围和功能信息**:
        {params_set_str}
        # 要求如下 #
        请你基于上述信息，直接输出一份 "在可调整的参数集合中选择一些你觉得有提升的参数进行推荐"  
        **严格要求：**
        1. 输出内容必须是一个合法的简单的 json 格式字符串。
        2. 模板参考如下格式(不确定的键值对可以不推荐, 也不要重复推荐， json 对象注意左右括号闭环， 不要引入 [（中括号） 括号)，且禁止出现多余的转义引号（例如 \"value\"）。
        {{
          "net.core.dev_weight": 128,
          "net.ipv4.tcp_keepalive_intvl": 60,
          "net.ipv4.tcp_keepalive_probes": 5,
          "net.ipv4.tcp_keepalive_time": 600,
          "net.ipv4.tcp_tw_reuse": 1,
          "net.ipv4.tcp_fin_timeout": 30,
          "net.ipv4.tcp_rmem": "4096 65536 16777216",
          "net.ipv4.tcp_wmem": "4096 65536 16777216",
          "net.ipv4.tcp_max_syn_backlog": 8192
        }}
        3. 只输出符合格式的 json 字符串，不要任何解释、注释、额外文字。 
        4. 基于上述内容，请你务必提供一份干净“简单”的 json 参数值推荐，方便我直接通过 json.loads 进行解析。
      meta: {lang: zh, version: 1}
  normal:
    idea:
      value: |
        # CONTEXT # 
        本次性能优化的目标为：
        性能指标为{performance_metric.name}, 该指标的含义为：{performance_metric.value}，目标是提升{slo_goal:.2%}
        性能分析报告：
        {performance_analysis_report}
        你可以分析的参数有：
        {params_set_str}
        # OBJECTIVE #
        你是一个专业的系统运维专家,当前性能指标未达到预期，请你基于以上性能分析报告分析有哪些调优思路。
        # Tone #
        你应该尽可能秉承严肃、认真、严谨的态度
        # AUDIENCE #
        你的答案将会是其他系统运维专家的重要参考意见，请认真思考后给出你的答案。
      meta: {lang: zh, version: 1}
    recommender_positive:
      value: |
        你是专业的系统运维专家。当前性能指标未达预期，但上一轮调优为正向结果（性能提升或无退化）。
        请在“心中完成推理”，只输出最终 JSON；除 JSON 以外不要输出任何文字、代码块或注释。

        目标：基于以下信息，在保持上轮有效方向的前提下，总结参数调整经验，进一步微调参数（在安全边界内适度加大力度），仅给出需要变更的参数与推荐新值。

        当前环境配置信息：
        {static_profile}

        历史调优信息（包含已修改参数与结果）：
        {history_result}

        调优思路：
        {optimization_idea}

        可调整参数全集（含类型/范围/枚举/默认值等）以及baseline对应的的取值为：
        {params_set_str}

        严格规则（务必遵守）：
        1) 仅输出与当前配置相比“需要变化”的参数；不相关或无收益的参数不要输出。
        2) 优先沿“上轮有效”的方向小步前进：连续型参数按原步长的 100%~150% 微增（通常为 +10%~+30%），离散/枚举取更激进且仍在安全范围的相邻档位；避免一次性过大变更（单参数变更幅度不超过 2 倍或 ±30%，取更严格者）。
        3) 不要动已证明对性能“无影响”的参数；避免同时调整明显互斥的参数。
        4) 必须满足依赖/互斥/上限下限/类型与单位要求；数值默认单位为“字节”。若数值后带单位，请以字符串表示（如 "512MB"）。
        5) 每个参数的推荐值必须可被系统实际接受并确保应用可启动。
        6) 若无合适变更，输出空json对象。

        输出格式（必须严格遵守）：
        - 仅输出一个 JSON 对象，键为“可调参数名称”，值为“推荐取值”。
        - 不要输出任何多余文字、说明、示例、代码围栏或注释。
    recommender_negative:
      value: |
        你是专业的系统运维专家。当前性能指标未达预期，且上一轮调优为负向结果（性能下降/不稳定/报错等）。
        请在“心中完成推理”，只输出最终 JSON；除 JSON 以外不要输出任何文字、代码块或注释。

        目标：基于以下信息，总结历史调优经验中的baseline、最佳调优结果、最差调优结果以及上一轮调优结果以及参数取值，反向微调上轮可能导致退化的参数，并选择更保守且安全的值；仅给出需要变更的参数与推荐新值。

        当前环境配置信息：
        {static_profile}

        历史调优信息（包含已修改参数与结果）：
        {history_result}

        调优思路：
        {optimization_idea}

        可调整参数全集（含类型/范围/枚举/默认值等）以及baseline对应的的取值为：
        {params_set_str}

        严格规则（务必遵守）：
        1) 仅输出与当前配置相比“需要变化”的参数；不相关或无收益的参数不要输出。
        2) 对上轮参与变更且疑似致退化的参数：沿“相反方向”小步调整（幅度为上轮步长的 30%~50%，通常为 -10%~-20%）；必要时关闭可选的高开销特性。
        3) 避免一次调整过多参数；不要同时调整互斥参数；优先选择风险更低的修正方案。
        4) 必须满足依赖/互斥/上限下限/类型与单位要求；数值默认单位为“字节”。若数值后带单位，请以字符串表示（如 "1GB"）。
        5) 每个参数的推荐值必须可被系统实际接受并确保应用可启动。
        6) 若无合适变更，输出空json对象。

        输出格式（必须严格遵守）：
        - 仅输出一个 JSON 对象，键为“可调参数名称”，值为“推荐取值”。
        - 不要输出任何多余文字、说明、示例、代码围栏或注释。
  slow:
    mem:
      value: |
        你是一个记忆摘要系统，负责记录并留存人类与AI调优专家围绕**{application}性能优化**展开的完整交互历史。
        你会获取专家在过去N轮调优中提出的调优思路，以及每一轮调优的实际执行反馈。你的任务是生成一份调优过程的完整摘要，内容需涵盖专家的核心优化思路及其对应的反馈细节，确保信息无歧义。
        无需完整存储专家的所有思路，请勿照搬复制全部信息，**仅提炼最重要的核心概念与关键反馈，同时必须保证数据严谨性，严禁伪造任何调优参数、性能指标及相关数据**。
        ### 整体结构
        - **概述（全局元数据）**
          - **任务目标**：{application}的具体性能优化目标（例如：提升每秒查询数QPS、降低延迟、优化并发处理能力）。
          - **进度状态**：当前完成进度、已达成的性能提升效果及关键里程碑。
        - **调优动作序列（按轮次编号记录）**
          每一轮调优仅记录一次，格式如下：
        i.  **第 i 轮调优**
            - **调优思路**：本轮调优的核心逻辑，包括识别出的性能瓶颈（例如：连接数限制、CPU资源饱和、长连接复用效率低）、未充分利用的系统资源，或面向特定场景的优化策略（例如：静态文件分发优化、反向代理缓冲配置）。
            - **核心参数**：本轮实际修改的{application}关键配置参数。仅保留当期迭代中变动的参数，需注明参数名称与精确取值（例如：针对Nginx的参数：worker_processes、worker_connections、keepalive_timeout、sendfile、tcp_nopush）。
            - **执行结果**：量化的性能表现数据，例如：每秒查询数（QPS）、P99延迟、错误率、CPU/内存使用率的调优前后对比值。
            - **关键结论**：从本轮结果中提炼的核心洞察。对于开关型离散参数（例如：开启/关闭），若已验证最优值则明确标注；对于缓冲区大小等连续型参数，需指明后续调整方向（增大/减小）；同时记录调优带来的副作用（例如：内存占用升高）。
        ### 示例模板（仅作格式参考）
        ```
        ## 专家调优历史摘要
        **任务目标：在高并发负载下，将 Nginx 的 QPS 提升 20%。
        **进度状态：已完成 70% 进度，实现 7% 的性能提升。
        0.  **第 0 轮调优**:
            - 调优思路：未执行调优操作 —— 建立初始性能基线。
            - 核心参数：无参数变更。
            - 执行结果：记录基线性能指标为 xxx。
            - 关键结论：未执行任何调优动作，建立初始性能基准值，供后续调优对比参考。
        1.  **第 1 轮调优**:
            - 调优思路：当前内存使用率远未达到阈值，可调整内存相关参数以提升利用率。
            - 核心参数：{{memory=50GB, xx=true}}
            - 执行结果：QPS 从 70507.0 提升至 129443.0（相对基线提升 83.59%，相对上一轮提升 83.59%）。
            - 关键结论：提升内存参数配置的方向正确，内存相关参数可进一步增大以获取更佳性能。
        ... (后续调优轮次按上述格式补充)
    recommender:
      value: |
        你是一位系统应用优化专家。你的任务是利用你在优化方面的丰富经验，提供相关的建议。
        ### 总体目标
        - 本场景的性能指标是 {performance_metric.name}，其含义为：{performance_metric.value}。调优优化的目标是实现 {slo_goal:.2%}。
        - 系统性能分析报告如下： {performance_analysis_report}
        - 可供分析的相关参数及其描述为：{params_set_str}
        """ + "{long_mem}" + "{short_mem}" + """
        ### 优化指南
        - **清晰**：确保答案清楚、简洁，并直接回应问题。
        - **谨慎、懒惰型修改**：仅输出预期能带来良好效果的参数调整；对于连续型参数，调整范围应在 0~50% 之间；对于离散/枚举型参数，避免极端跨度调整；不要调整在上下文分析中被认定为“对性能无影响”的参数。
        - **逻辑性**：参数调整应符合调优策略，每个调整都应有相应的逻辑，并严格同时调整互斥参数。
        - **严格格式化**：必须符合类型和单位要求；数值的默认单位为 “bytes”。如果数值后跟单位，应以字符串表示（例如 "512MB"）。参数输出必须为**JSON 格式**。
        ### 示例模板
        ```
          {{
              "tuning_concept": "当前场景的主要瓶颈在 IO，但系统的内存使用率仅约为当前容量的 30%。当前内存参数设置为 20G，建议适当增加以提升内存资源利用率，从而加速性能 ... （更多调优概念）",
              "PARAM": {{
                  "memory": "30GB",
                  ... (更多参数)
              }}
          }}
        ```
