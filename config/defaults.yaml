
# ==================================================== common =====================================================
common: &common
  mode: normal  # fast, normal, slow  ;default slow
  extractor:
    value: ""
    meta: {lang: en, version: 1}
  analyzer:
    value: ""
    meta: {lang: en, version: 1}
  collector:
    value: ""
    meta: {lang: en, version: 1}
  fast:
    recommender:
      value: |
        # CONTEXT #
        [{self.service_name} Category] The goal of this performance optimization is:
        Performance metric is {self.performance_metric.name}, which means: {self.performance_metric.value}, target is to improve by {self.slo_goal:.2%}.
        Current environment configuration:
        {self.static_profile}
        Historical tuning information (reference for improvements):
        {history_result}
        Current system load and performance analysis:
        {self.performance_analysis_report}
        Adjustable parameter set:
        {params_set_str}
        # OBJECTIVE #
        Current performance metrics do not meet expectations, please output a **parameter combination** directly based on the above information.
        1. Output must be a valid JSON object.
        2. Format as follows:
        {{
          parameter_name: value (if unsure about this value, this parameter set can be omitted)
        }}
        3. Only output key-value pairs, no explanations, comments, or extra text.
        4. Only include parameter adjustments that have positive impact on performance.
        5. Please output in English.
      meta: {lang: en, version: 1}
  normal:
    idea:
      value: |
        # CONTEXT # 
        The goal of this performance optimization is:
        Performance metric is {self.performance_metric.name}, which means: {self.performance_metric.value}, target is to improve by {self.slo_goal:.2%}
        Performance analysis report:
        {self.performance_analysis_report}
        Parameters you can analyze:
        {params_set_str}
        # OBJECTIVE #
        You are a professional system operations expert. Current performance metrics do not meet expectations. Please analyze potential tuning ideas based on the above performance analysis report.
        # Tone #
        You should maintain a serious, careful, and rigorous attitude as much as possible.
        # AUDIENCE #
        Your answer will be an important reference for other system operations experts, please provide your answer after careful consideration. Please output in English.
    recommender_positive:
      value: |
        [{self.service_name} Category] You are a professional system operations expert. Current performance metrics do not meet expectations. Please select adjustable parameter values based on the following tuning ideas, current environment configuration, and adjustable parameters.
        Please keep descriptions concise, focus on the key adjustment directions that need output, no need to summarize viewpoints, and do not output anything that has no impact on performance.
        Current environment configuration:
        {self.static_profile}
        Historical tuning information, historical tuning modified the following parameters, you can refer to this historical information to reflect on potential improvement points: 
        {history_result}
        Tuning ideas are:
        {optimization_idea}
        Parameters you can adjust are:
        {params_set_str}
        Please answer in JSON format, key is the adjustable parameter name, please provide adjustable parameters based on the above environment configuration information. If parameters are irrelevant, do not include them.
        value is the recommended value for the adjustable parameter, please provide reasonable specific values based on the above environment configuration information, carefully confirm whether each value can be used, avoid application startup failures after setting.
        Remember that the value of value should not contain any expressions. If there is an expression involving multiplication of two numbers, please calculate their result.
        Do not provide any response other than JSON, avoid adding comments. Please output in English.
    recommender_negative:
      value: |
        [{self.service_name} Category] You are a professional system operations expert. Current performance metrics do not meet expectations. Please select adjustable parameter values based on the following tuning ideas, current environment configuration, and adjustable parameters.
        Please keep descriptions concise, focus on the key adjustment directions that need output, no need to summarize viewpoints, and do not output anything that has no impact on performance.
        Current environment configuration:
        {self.static_profile}
        Historical tuning information, historical tuning modified the following parameters, you can refer to this historical information to reflect on potential improvement points: 
        {history_result}
        Tuning ideas are:
        {optimization_idea}
        Parameters you can adjust are:
        {params_set_str}
        Please answer in JSON format, key is the adjustable parameter name, please provide adjustable parameters based on the above environment configuration information. If parameters are irrelevant, do not include them.
        value is the recommended value for the adjustable parameter, please provide reasonable specific values based on the above environment configuration information, carefully confirm whether each value can be used, avoid application startup failures after setting.
        Do not provide any response other than JSON, avoid adding comments. Please output in English.
  slow:
    recommender:
      value: ""
      meta: {lang: en, version: 1}    
# ==================================================== nginx =====================================================
nginx:
  mode: normal  # fast, normal, slow  ;default slow
  extractor:
    value: ""
    meta: {lang: en, version: 1}
  analyzer:
    value: ""
    meta: {lang: en, version: 1}
  collector:
    value: ""
    meta: {lang: en, version: 1}
  fast:
    recommender:
      value: |
        # CONTEXT #
        [{self.service_name} Category] The goal of this performance optimization is:  
        Performance metric is {self.performance_metric.name}, which means: {self.performance_metric.value}, target is to improve by {self.slo_goal:.2%}.
        Current environment configuration:  
        {self.static_profile}  
        Historical tuning information (reference for improvements):  
        {history_result}
        Current system load and performance analysis:
        {self.performance_analysis_report}
        **Adjustable parameter set with value ranges and functional information**:
        {params_set_str}
        # REQUIREMENTS #
        Please output a "selection of parameters you believe will improve performance from the adjustable parameter set" directly based on the above information.
        **Strict requirements:**
        1. Output must be a valid simple JSON format string.
        2. Template reference format (uncertain key-value pairs can be omitted, do not repeat recommendations, JSON object should have proper bracket closure, do not introduce [ brackets), and avoid extra escape quotes (e.g., \"value\").
        {{
          "net.core.dev_weight": 128,
          "net.ipv4.tcp_keepalive_intvl": 60,
          "net.ipv4.tcp_keepalive_probes": 5,
          "net.ipv4.tcp_keepalive_time": 600,
          "net.ipv4.tcp_tw_reuse": 1,
          "net.ipv4.tcp_fin_timeout": 30,
          "net.ipv4.tcp_rmem": "4096 65536 16777216",
          "net.ipv4.tcp_wmem": "4096 65536 16777216",
          "net.ipv4.tcp_max_syn_backlog": 8192
        }}
        3. Only output JSON string in the correct format, no explanations, comments, or extra text. 
        4. Based on the above content, please provide a clean "simple" JSON parameter value recommendation that I can directly parse with json.loads.
        5. Please output in English.
      meta: {lang: en, version: 1}
  normal:
    idea:
      value: |
        # CONTEXT # 
        The goal of this performance optimization is:
        Performance metric is {self.performance_metric.name}, which means: {self.performance_metric.value}, target is to improve by {self.slo_goal:.2%}
        Performance analysis report:
        {self.performance_analysis_report}
        Parameters you can analyze:
        {params_set_str}
        # OBJECTIVE #
        You are a professional system operations expert. Current performance metrics do not meet expectations. Please analyze potential tuning ideas based on the above performance analysis report.
        # Tone #
        You should maintain a serious, careful, and rigorous attitude as much as possible.
        # AUDIENCE #
        Your answer will be an important reference for other system operations experts, please provide your answer after careful consideration. Please output in English.
      meta: {lang: en, version: 1}
    recommender_positive:
      value: |
        You are a professional system operations expert. Current performance metrics do not meet expectations, but the previous tuning round showed positive results (performance improvement or no degradation).
        Please "complete reasoning internally", only output the final JSON; do not output any text, code blocks, or comments other than JSON.

        Goal: Based on the following information, while maintaining the effective direction from the previous round, summarize parameter adjustment experience, further fine-tune parameters (moderately increase intensity within safe boundaries), only provide parameters that need changes and their recommended new values.

        Current environment configuration:
        {self.static_profile}

        Historical tuning information (including modified parameters and results):
        {history_result}

        Tuning ideas:
        {optimization_idea}

        Full set of adjustable parameters (with type/range/enum/default values, etc.) and baseline corresponding values:
        {params_set_str}

        Strict rules (must comply):
        1) Only output parameters that "need changes" compared to current configuration; do not output irrelevant or non-beneficial parameters.
        2) Prioritize small steps forward along the "previously effective" direction: continuous parameters increase by 100%~150% of the original step size (typically +10%~+30%), discrete/enum parameters take more aggressive but still safe adjacent levels; avoid one-time excessive changes (single parameter change amplitude should not exceed 2x or ±30%, whichever is stricter).
        3) Do not touch parameters proven to have "no impact" on performance; avoid adjusting obviously conflicting parameters simultaneously.
        4) Must satisfy dependency/mutual exclusion/upper-lower limit/type and unit requirements; numerical default unit is "bytes". If value has unit, represent as string (e.g., "512MB").
        5) Each parameter's recommended value must be actually acceptable by the system and ensure application can start.
        6) If no suitable changes, output empty JSON object.
        7) Please output in English.

        Output format (must strictly comply):
        - Only output one JSON object, key is "adjustable parameter name", value is "recommended value".
        - Do not output any extra text, explanations, examples, code fences, or comments.
    recommender_negative:
      value: |
        You are a professional system operations expert. Current performance metrics do not meet expectations, and the previous tuning round showed negative results (performance degradation/instability/errors, etc.).
        Please "complete reasoning internally", only output the final JSON; do not output any text, code blocks, or comments other than JSON.

        Goal: Based on the following information, summarize baseline, best tuning results, worst tuning results, and previous round tuning results and parameter values from historical tuning experience, reversely fine-tune parameters that may have caused degradation in the previous round, and select more conservative and safe values; only provide parameters that need changes and their recommended new values.

        Current environment configuration:
        {self.static_profile}

        Historical tuning information (including modified parameters and results):
        {history_result}

        Tuning ideas:
        {optimization_idea}

        Full set of adjustable parameters (with type/range/enum/default values, etc.) and baseline corresponding values:
        {params_set_str}

        Strict rules (must comply):
        1) Only output parameters that "need changes" compared to current configuration; do not output irrelevant or non-beneficial parameters.
        2) For parameters changed in the previous round and suspected of causing degradation: adjust in the "opposite direction" with small steps (amplitude 30%~50% of the previous step size, typically -10%~-20%); disable optional high-overhead features when necessary.
        3) Avoid adjusting too many parameters at once; do not adjust mutually exclusive parameters simultaneously; prioritize lower-risk correction solutions.
        4) Must satisfy dependency/mutual exclusion/upper-lower limit/type and unit requirements; numerical default unit is "bytes". If value has unit, represent as string (e.g., "1GB").
        5) Each parameter's recommended value must be actually acceptable by the system and ensure application can start.
        6) If no suitable changes, output empty JSON object.
        7) Please output in English.

        Output format (must strictly comply):
        - Only output one JSON object, key is "adjustable parameter name", value is "recommended value".
        - Do not output any extra text, explanations, examples, code fences, or comments.
  slow:
    recommender:
      value: ""
      meta: {lang: en, version: 1}
