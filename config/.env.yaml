feature:
  - need_restart_application: True
    need_recover_cluster: False
    microDep_collector: True
    pressure_test_mode: True
    tune_system_param: False
    tune_app_param: True
    strategy_optimization: False
    benchmark_timeout: 3600
    max_iterations: 10
    slo_goal: 0.1
    best_param_save_path: "best_params.json"
    data_dir: "data"
    save_snapshot: True
    use_snapshot: False
    max_retries: 3
    delay: 1.0


# 是否开启大模型的ssl验证 enable 开启 disable 关闭 默认开启，当大模型无法通过ssl验证的时候可以改成disable
ssl: enable 

log_level: info
log_dir: "log"
llm_log_to_file: True
llm_log_to_console: True
language: "en"