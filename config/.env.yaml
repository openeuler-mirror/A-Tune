LLM_KEY: "LLM_KEY"
LLM_URL: "LLM_URL"
LLM_MODEL_NAME: "LLM_MODEL_NAME"
LLM_MAX_TOKENS: 8192

REMOTE_EMBEDDING_ENDPOINT: "EMBEDDING_MODEL_URL"
REMOTE_EMBEDDING_MODEL_NAME: "EMBEDDING_MODEL_NAME"

servers:
 - ip: ""
   host_user: ""
   password: ""
   port: 22
   app: "mysql"
   listening_address: "localhost"
   listening_port: 3306
   target_process_name: "mysqld"
   business_context: "高并发数据库服务，CPU负载主要集中在用户态处理"

