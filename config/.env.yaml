REMOTE_EMBEDDING_ENDPOINT: "YOUR_EMBEDDING_MODEL_URL"
REMOTE_EMBEDDING_MODEL_NAME: "YOUR_MODEL_NAME"

servers:
  - ip: ""
    host_user: ""
    password: ""
    port:
    app: "mysql"
    target_process_name: "mysqld"
    business_context: "高并发数据库服务，CPU负载主要集中在用户态处理"
    max_retries: 3
    delay: 1.0

